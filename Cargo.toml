[package]
name = "rive-bevy"
description = "Rive Bevy plugin"
version = "0.1.0"
edition = "2021"
authors = ["Dragoș Tiselice <dragos@rive.app>"]
homepage = "https://rive.app/"
repository = "https://github.com/rive-app/rive-bevy"
documentation = "https://help.rive.app/game-runtimes/bevy"
keywords = ["rive", "bevy", "plugin", "ui", "animation"]
categories = ["game-development"]
license = "MIT"
readme = "../README.md"

[features]
default = ["pointer-events"]
metal-renderer = ["rive-rs/metal-renderer", "dep:wgpu"]
pointer-events = ["bevy/bevy_mesh", "bevy/bevy_pbr", "bevy/bevy_sprite"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "std",
] }
etagere = "0.2.8"
rive-rs = { git = "https://github.com/Jaltaire/rive-rs", branch = "bevy-0.19", default-features = false, features = ["vello"] }
thiserror = "2.0"
vello = "0.9.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { version = "29", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
rand = "0.8.5"


[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
